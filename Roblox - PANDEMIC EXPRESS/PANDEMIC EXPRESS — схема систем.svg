<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
<title id="title">PANDEMIC EXPRESS — карта систем</title>
<desc id="desc">Архитектурная карта Roblox плейса: мир и шаблоны подключены к авторитетным серверным системам, которые общаются с клиентом через ReplicatedStorage.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#d6ad63"/></marker>
  <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#82c8c3"/></marker>
  <style>
   .bg{fill:#0c1017}.card{fill:#171e29;stroke:#3a4656;stroke-width:2}.sub{fill:#121821;stroke:#344050;stroke-width:1.5}.gold{fill:#e5c17a}.teal{fill:#8ad2ca}.violet{fill:#c1a6ff}.white{fill:#f3efe6}.muted{fill:#a8b2c0}.line{fill:none;stroke:#d6ad63;stroke-width:3;marker-end:url(#arrow)}.line2{fill:none;stroke:#82c8c3;stroke-width:3;marker-end:url(#arrow2)}.dash{stroke-dasharray:8 8}
   text{font-family:Segoe UI,Arial,sans-serif}.head{font-size:30px;font-weight:700}.label{font-size:22px;font-weight:700}.body{font-size:17px}.small{font-size:14px}.chip{font-size:14px;font-weight:600}
  </style>
</defs>
